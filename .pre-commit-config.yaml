minimum_pre_commit_version: '3.5.0'
default_stages: [pre-commit]

# Bewusst pre-commit statt husky/lint-staged: dasselbe Werkzeug wie in tallox.go, im
# DevContainer schon installiert, und gitleaks lässt sich damit ohne Umweg einbinden.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^schema\.graphql$|^src/lib/gql/__generated__/
      - id: end-of-file-fixer
        exclude: ^schema\.graphql$|^src/lib/gql/__generated__/
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        # Eigene Regel für das tallox_-Tokenformat. Der realistische Leckpfad ist nicht der
        # Server, sondern ein Auswertungsskript im Commit.
        args: ['--config', '.gitleaks.toml']

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write
        language: system
        types_or: [javascript, ts, svelte, json, css, html, markdown, yaml]

      - id: eslint
        name: eslint
        entry: pnpm exec eslint --fix
        language: system
        types_or: [javascript, ts, svelte]

      - id: svelte-check
        name: svelte-check
        entry: pnpm run check
        language: system
        types_or: [ts, svelte]
        pass_filenames: false
