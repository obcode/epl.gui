version: 2

# Version-Updates für alle drei Quellen, aus denen dieses Repo Fremdcode zieht:
# npm-Pakete (pnpm-Lockfile), Actions in der Pipeline, Base-Images im Dockerfile.
#
# Die commit-message-Präfixe sind nicht kosmetisch: semantic-release leitet den Release
# daraus ab (siehe ci.yml). Ein `chore` erzeugt keinen Release — und ohne Release baut
# docker.yml kein Image und dispatcht keinen Deploy. Was auf dem Server ankommen soll,
# muss also `fix` sein.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    # Karenzzeit, damit ein frisch veröffentlichtes npm-Paket nicht am selben Tag im
    # Lockfile landet. Ohne das öffnet Dependabot PRs, die pnpm anschließend selbst
    # ablehnt (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION) — genau so passiert am
    # 2026-07-30, siehe PR #7. Die drei Tage liegen mit Abstand über pnpms 24 Stunden.
    # Majors bekommen mehr Zeit, weil sich die Fehler eines .0-Releases erst zeigen
    # müssen.
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    # dependencies landen über die prod-deps-Stufe im Image → `fix`.
    # devDependencies (vite, eslint, playwright …) nicht → `chore`, kein Release.
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps-dev)
    groups:
      # Ein PR je Klasse statt zwanzig. Majors bleiben bewusst einzeln — Svelte,
      # SvelteKit und Vite will man nicht im Rudel durchwinken.
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    # Actions kennen kein SemVer, hier greift nur default-days. Eine unterwanderte
    # Action ist der klassische CI-Angriffsweg — eine Woche Abstand ist billig.
    cooldown:
      default-days: 7
    # Ändert nur die Pipeline, nicht das ausgelieferte Artefakt → kein Release.
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    # Docker-Tags kennen kein SemVer, hier greift nur default-days.
    cooldown:
      default-days: 7
    # Das Base-Image (`node:24-alpine`, in allen drei Stufen) steckt im ausgelieferten
    # Image → Patch-Release, damit auch tatsächlich neu gebaut und ausgerollt wird.
    commit-message:
      prefix: fix(docker)
    # Die Runtime-Stufe ist das Produktions-Image und gehört auf eine LTS-Linie. Node 24
    # ist Active LTS bis 2028-04-30. Die beiden Alternativen sind es nicht:
    #
    #   Node 25 — nie LTS gewesen, EOL seit 2026-06-01
    #   Node 26 — erst ab 2026-10-28 LTS
    #
    # Das steht hier und nicht als geschlossener PR, weil Dependabot einen manuell
    # geschlossenen PR nur als „diese eine Version nicht" liest und daraufhin den
    # nächstniedrigeren Major anbietet — am 2026-07-30 also das EOL-Node-25 (PR #13),
    # nachdem PR #1 auf 26 geschlossen worden war. Ein Downgrade als Folge einer
    # Ablehnung ist genau das, was diese Regel verhindert.
    #
    # AUFHEBEN AB 2026-10-28: dann ist Node 26 LTS und dieser Block kann weg.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    groups:
      docker-images:
        patterns: ['*']
        update-types: [minor, patch]
