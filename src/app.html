<!doctype html>
<!--
	Das data-theme setzt hooks.server.ts aus dem Cookie ein. Platzhalter für das ganze Attribut
	und nicht nur für den Wert: bei der Auswahl „System" muss es komplett verschwinden, sonst
	greifen die --default/--prefersdark-Themes aus app.css nicht.
-->
<html lang="de" %tallox.themeattr%>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
